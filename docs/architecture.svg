    <g filter="url(#shadow)">
      <rect x="545" y="342" width="350" height="156" rx="18" fill="#F4F1E8"/>
      <rect x="545" y="342" width="350" height="7" rx="3.5" fill="url(#green)"/>
    </g>
    <rect x="573" y="374" width="42" height="42" rx="11" fill="#171923"/>
    <circle cx="594" cy="395" r="11" stroke="#CFF34E" stroke-width="2"/>
    <path d="M589 395H599M594 390V400" stroke="#CFF34E" stroke-width="2" stroke-linecap="round"/>
    <text x="633" y="386" fill="#676B79" font-size="12" font-weight="700" letter-spacing="1.4">FINANCIAL CORE</text>
    <text x="573" y="449" fill="#171923" font-size="25" font-weight="700">Treasury.sol</text>
    <text x="573" y="476" fill="#676B79" font-size="14">Payments · Prize pools · Rewards</text>

    <!-- Flow lines top -->
    <path d="M615 256C520 285 410 294 346 340" stroke="#8589FF" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <path d="M720 256V328" stroke="#CFF34E" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <path d="M825 256C920 285 1030 294 1094 340" stroke="#8589FF" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <path d="M510 420H531" stroke="#8589FF" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <path d="M930 420H909" stroke="#CFF34E" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

