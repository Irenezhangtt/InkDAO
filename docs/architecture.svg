    <text x="64" y="88" fill="#8F95A8" font-size="14">Governance, capital, identity, and application logic — separated by design.</text>
    <g transform="translate(1085 44)">
      <circle cx="8" cy="8" r="6" fill="#8589FF"/>
      <text x="24" y="13" fill="#A8ADBC" font-size="12">governance flow</text>
      <circle cx="151" cy="8" r="6" fill="#CFF34E"/>
      <text x="167" y="13" fill="#A8ADBC" font-size="12">capital flow</text>
    </g>

    <!-- Community -->
    <g filter="url(#shadow)">
      <rect x="510" y="154" width="420" height="102" rx="16" fill="#F4F1E8"/>
      <rect x="510" y="154" width="7" height="102" rx="3.5" fill="#CFF34E"/>
    </g>
    <circle cx="563" cy="205" r="22" fill="#171923"/>
    <path d="M552 207C552 199 557 194 563 194C569 194 574 199 574 207M547 218C550 211 556 208 563 208C570 208 576 211 579 218" stroke="#CFF34E" stroke-width="2" stroke-linecap="round"/>
    <text x="604" y="197" fill="#171923" font-size="13" font-weight="700" letter-spacing="1.6">COMMUNITY LAYER</text>
    <text x="604" y="224" fill="#171923" font-size="20" font-weight="700">Readers · Writers · Token holders</text>

