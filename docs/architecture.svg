<svg width="1440" height="820" viewBox="0 0 1440 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11131A"/>
      <stop offset="1" stop-color="#1B1E2A"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6E73FF"/>
      <stop offset="1" stop-color="#474ED2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DEFF62"/>
      <stop offset="1" stop-color="#A9D62F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8589FF"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#CFF34E"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#73798C"/>
    </marker>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <path d="M0 117H1440" stroke="#2C3040"/>
  <path d="M1010 0V820" stroke="#242837"/>
  <circle cx="1330" cy="100" r="180" fill="#5057D9" fill-opacity=".06"/>
  <circle cx="90" cy="760" r="220" fill="#D7FF3F" fill-opacity=".035"/>

  <g font-family="Inter, Arial, sans-serif">
