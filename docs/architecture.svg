      <rect x="160" y="348" width="350" height="144" rx="18" fill="url(#indigo)"/>
    </g>
    <rect x="188" y="374" width="42" height="42" rx="11" fill="#FFFFFF" fill-opacity=".12"/>
    <path d="M199 403H219M202 397V388H216V397M205 388V383H213V388" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="248" y="386" fill="#D9DBFF" font-size="12" font-weight="700" letter-spacing="1.4">GOVERNANCE</text>
    <text x="188" y="446" fill="white" font-size="25" font-weight="700">Governor.sol</text>
    <text x="188" y="472" fill="#E5E6FF" font-size="14">Propose · Vote · Execute</text>

