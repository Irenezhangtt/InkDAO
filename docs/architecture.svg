      <circle cx="96" cy="633" r="10" fill="#8589FF"/>
      <text x="118" y="638" fill="#F4F1E8" font-size="17" font-weight="700">NovelToken.sol</text>
      <text x="88" y="678" fill="#8F95A8" font-size="13">NVT participation token</text>
      <rect x="88" y="696" width="78" height="22" rx="11" fill="#8589FF" fill-opacity=".14"/>
      <text x="104" y="711" fill="#B9BCFF" font-size="10" font-weight="700">ERC-20</text>
    </g>
    <g>
      <rect x="374" y="600" width="294" height="132" rx="16" fill="#222634" stroke="#3A4053"/>
      <circle cx="406" cy="633" r="10" fill="#CFF34E"/>
      <text x="428" y="638" fill="#F4F1E8" font-size="17" font-weight="700">Membership.sol</text>
      <text x="398" y="678" fill="#8F95A8" font-size="13">Paid access registry</text>
      <rect x="398" y="696" width="96" height="22" rx="11" fill="#CFF34E" fill-opacity=".12"/>
      <text x="413" y="711" fill="#CFF34E" font-size="10" font-weight="700">ONBOARDING</text>
    </g>
    <g>
      <rect x="684" y="600" width="294" height="132" rx="16" fill="#222634" stroke="#3A4053"/>
      <circle cx="716" cy="633" r="10" fill="#FF8069"/>
      <text x="738" y="638" fill="#F4F1E8" font-size="17" font-weight="700">RoleManager.sol</text>
      <text x="708" y="678" fill="#8F95A8" font-size="13">Reader · Author · Admin</text>
      <rect x="708" y="696" width="94" height="22" rx="11" fill="#FF8069" fill-opacity=".12"/>
      <text x="725" y="711" fill="#FF9B89" font-size="10" font-weight="700">IDENTITY</text>
    </g>
    <g>
      <rect x="994" y="600" width="382" height="132" rx="16" fill="#222634" stroke="#3A4053"/>
      <circle cx="1026" cy="633" r="10" fill="#68C6FF"/>
      <text x="1048" y="638" fill="#F4F1E8" font-size="17" font-weight="700">External infrastructure</text>
      <text x="1018" y="678" fill="#8F95A8" font-size="13">Chainlink price data · Aave research</text>
      <rect x="1018" y="696" width="100" height="22" rx="11" fill="#68C6FF" fill-opacity=".12"/>
      <text x="1034" y="711" fill="#8FD5FF" font-size="10" font-weight="700">OPTIONAL</text>
    </g>

    <!-- Flow lines bottom -->
    <path d="M635 498C560 545 300 548 211 588" stroke="#CFF34E" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M680 498C650 548 560 550 521 588" stroke="#CFF34E" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M760 498C790 548 820 550 831 588" stroke="#73798C" stroke-width="2" marker-end="url(#arrowMuted)"/>
    <path d="M815 498C910 540 1120 540 1185 588" stroke="#73798C" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrowMuted)"/>

    <text x="64" y="782" fill="#666D80" font-size="11">Community intent → governed execution → transparent settlement</text>
    <text x="1200" y="782" fill="#666D80" font-size="11">Ethereum · Sepolia</text>
  </g>
</svg>
