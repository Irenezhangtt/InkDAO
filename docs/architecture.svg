    <rect x="958" y="374" width="42" height="42" rx="11" fill="#CFF34E" fill-opacity=".13"/>
    <path d="M968 399L976 407L992 388" stroke="#CFF34E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
